# El plan gratuito de Supabase pausa los proyectos sin actividad. Esta tarea hace una lectura pública
# liviana una vez por día para que la base de datos del juego no se pause.
name: Mantener activa la base de datos
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lectura pública (récords mundiales)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://fhfafgsmizuvjvqlcjor.supabase.co/rest/v1/rpc/dc_world_records" \
            -H "apikey: sb_publishable_IVUm-v872fJpZotySj_m5A_Dyw65gc9" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $code"
          if [ "$code" != "200" ]; then echo "::error::La base de datos no respondió ($code). Puede estar pausada: reactivarla desde el panel de Supabase."; exit 1; fi
