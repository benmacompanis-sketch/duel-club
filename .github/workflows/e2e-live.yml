# Prueba de punta a punta contra el sitio publicado y la base de datos real (otra máquina, sin Claude).
name: Prueba del sitio publicado
on:
  workflow_run:
    workflows: ['Publicar en GitHub Pages']
    types: [completed]
  workflow_dispatch:
# una sola prueba a la vez (dos pruebas en paralelo se cruzarían en "buscar rival")
concurrency:
  group: e2e-live
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - name: Prueba general (cuentas, partida, tienda, amigos, ranking)
        run: node tests/e2e/live.mjs
      - name: Prueba del modo online (dos compus)
        if: ${{ always() }}
        run: node tests/e2e/live-online.mjs
